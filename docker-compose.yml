services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: streampulse-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client listeners: PLAINTEXT (host, localhost:9092) and INTERNAL (other containers, kafka:29092).
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: streampulse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streampulse}
      POSTGRES_USER: ${POSTGRES_USER:-streampulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streampulse} -d ${POSTGRES_DB:-streampulse}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot job: creates the topic explicitly (3 partitions, replication factor 1) once Kafka is healthy.
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: streampulse-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
      --create --if-not-exists --topic ${KAFKA_TOPIC:-ecommerce_orders}
      --partitions 3 --replication-factor 1

  # Spark job container (profile "spark": not started by a plain `docker compose up`).
  # Use scripts\run_stream.ps1 instead of starting it by hand.
  spark:
    image: streampulse-spark:4.2.0
    build: ./docker/spark
    profiles: ["spark"]
    working_dir: /app
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-ecommerce_orders}
      SPARK_MAX_OFFSETS_PER_TRIGGER: ${SPARK_MAX_OFFSETS_PER_TRIGGER:-10000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-streampulse}
      POSTGRES_USER: ${POSTGRES_USER:-streampulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      - ./data:/app/data

  # Airflow (profile "airflow"): orchestrates the FINITE steps only. Start with scripts/airflow_up.ps1.
  airflow:
    image: streampulse-airflow:2.10.5
    build: ./docker/airflow
    container_name: streampulse-airflow
    profiles: ["airflow"]
    # Runs as root on purpose: the shared ./data folder (Spark checkpoint, Parquet) is written by the Spark
    # container as root, so tasks need the same identity (first DAG run failed with "Permission denied").
    # HOME keeps the pre-downloaded Spark connector (ivy cache) of the airflow user in use.
    user: "0:0"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      HOME: /home/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-streampulse}:${POSTGRES_PASSWORD:-}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-change-me-in-env}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
      # settings read by the StreamPulse code that the tasks run
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-ecommerce_orders}
      SPARK_MAX_OFFSETS_PER_TRIGGER: ${SPARK_MAX_OFFSETS_PER_TRIGGER:-10000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-streampulse}
      POSTGRES_USER: ${POSTGRES_USER:-streampulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./src:/opt/streampulse/src
      - ./config:/opt/streampulse/config
      - ./scripts:/opt/streampulse/scripts
      - ./sql:/opt/streampulse/sql
      - ./tests:/opt/streampulse/tests
      - ./pytest.ini:/opt/streampulse/pytest.ini
      - ./docs:/opt/streampulse/docs:ro
      - ./data:/opt/streampulse/data
    command: >
      bash -c "airflow db migrate
      && (airflow users create --username admin --firstname Stream --lastname Pulse --role Admin
      --email admin@example.com --password \"$$AIRFLOW_ADMIN_PASSWORD\" || true)
      && (airflow scheduler &) && exec airflow webserver"

volumes:
  kafka_data:
  postgres_data:
